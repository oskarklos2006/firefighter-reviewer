[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "firefighter-reviewer"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",

    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    "sqlalchemy>=2.0",

    # HTTP client for LLM API calls
    "httpx>=0.27",

    "python-dateutil>=2.9",

    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",        # linter + formatter, replaces flake8+black
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "llm: marks tests that make real LLM API calls (slow, rate-limited)"
]