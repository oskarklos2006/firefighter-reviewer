server {
    listen 3000;

    # Serve frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Forward API calls to backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}