services:
  backend:
    build: ./backend
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS}
    volumes:
      - ./backend/data:/app/data
    # No ports — backend hidden from outside

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend